name: Frontend Linter

on:
  push:
    branches:
      - main
      - staging
    paths:
      - "frontend/**"
  pull_request:
    branches:
      - "**"
    paths:
      - "frontend/**"

jobs:
  frontend-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: |
          cd frontend
          pnpm install --frozen-lockfile

      - name: Lint code with ESLint
        run: |
          cd frontend
          pnpm lint

      - name: Run tests
        run: |
          cd frontend
          pnpm test

      - name: Run build
        run: |
          cd frontend
          pnpm run build
