name: Docker Build, Push and Deploy Pitchlake Indexer
on:
  push:
    branches:
      - staging
      - deploy-indexer

env:
    AWS_REGION: eu-central-1
    ECR_REPOSITORY: pitchlake-images-repository
    ECR_REGISTRY: 065525255352.dkr.ecr.eu-central-1.amazonaws.com
    EC2_SERVICE: pitchlake-indexer
    EC2_HOST: ${{ secrets.EC2_HOST }}
    EC2_USER: ${{ secrets.EC2_USER }}
    PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
    APP_PORT: ${{ secrets.APP_PORT }}
    CONTAINER_NAME: pitchlake_indexer
    L1_URL: ${{ secrets.L1_URL }}
    DB_URL: ${{ secrets.DB_URL }}
    UDC_ADDRESS: ${{ secrets.UDC_ADDRESS }}
    RPC_URL: ${{ secrets.RPC_URL }}

permissions:
  id-token: write
  contents: write

jobs:
  build_push_deploy:
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Check if Docker is installed
        run: |
          if ! command -v docker &> /dev/null
          then
            sudo apt update
            sudo apt install -y docker.io
            sudo apt install -y docker-compose
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::065525255352:role/kyoto-fossil-github-oidc-role
          role-session-name: Github
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          mask-password: "true"

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ env.ECR_REPOSITORY }}
        run: |
          IMAGE_TAG=pitchlake-indexer-${{ github.sha }}
          IMAGE_URI=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV
          docker buildx build --platform=linux/amd64 -f ./contracts-indexer/event-logger/Dockerfile -t $IMAGE_URI ./contracts-indexer/event-logger
          docker push $IMAGE_URI
      
      - name: Change key permission
        run: |
          echo "${{ env.PRIVATE_KEY }}" > private_key.pem
          chmod 600 private_key.pem

      - name: Login to AWS ECR from EC2 instance, pull and deploy image
        env: 
          AWS_REGION: ${{ env.AWS_REGION }}
          ECR_REGISTRY: ${{ env.ECR_REGISTRY }}
          ECR_REPOSITORY: ${{ env.ECR_REPOSITORY }}
          IMAGE_TAG: pitchlake-indexer-${{ github.sha }}
          CONTAINER_NAME: ${{ env.CONTAINER_NAME }}
          L1_URL: ${{ secrets.L1_URL }}
          DB_URL: ${{ secrets.DB_URL }}
        run: |
          ssh -v -o StrictHostKeyChecking=no -i private_key.pem ${{ env.EC2_USER }}@${{ env.EC2_HOST }} "
            sudo docker ps -aq | xargs docker stop | xargs docker rm
            sudo docker rmi $(sudo docker images -q)
            aws ecr get-login-password --region ${AWS_REGION} | sudo docker login --username AWS --password-stdin ${ECR_REGISTRY}
            sudo docker pull ${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}
            sudo docker run -d \
              --name ${CONTAINER_NAME} \
              -e RPC_URL=${{ env.RPC_URL }} \
              -e UDC_ADDRESS=${{ env.UDC_ADDRESS }} \
              -p ${{ env.APP_PORT }}:${{ env.APP_PORT }} \
              -v $HOME/snapshots/juno_testnet/:/snapshots \
              -e DB_URL=${{ env.DB_URL }} \
              -e L1_URL=${{ env.L1_URL }} \
              ${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}
            "
      
      - name: Logout from AWS ECR on EC2
        env:
          AWS_REGION: ${{ env.AWS_REGION }}
          ECR_REGISTRY: ${{ env.ECR_REGISTRY }}
        run: |
          ssh -v -o StrictHostKeyChecking=no -i private_key.pem ${{ env.EC2_USER }}@${{ env.EC2_HOST }} "
            aws ecr get-login-password --region ${AWS_REGION} | sudo docker logout ${ECR_REGISTRY}
          "
      
      - name: Cleanup private key
        run: rm private_key.pem
