name: Frontend CI Pipeline

on:
  push:
    branches:
      - "**"
    paths:
      - "frontend/**"
  pull_request:
    branches:
      - "**"
    paths:
      - "frontend/**"
    types:
      - reopened
      - ready_for_review
      - synchronize

jobs:
  frontend-ci-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18"

      - name: Setup pnpm
        run: npm install -g pnpm@9.3.0

      - name: Install dependencies with pnpm
        run: |
          cd frontend
          pnpm install

      - name: Lint code with ESLint
        run: |
          cd frontend
          pnpm lint
        env:
          CI: true

      - name: Build the project
        run: |
          cd frontend
          pnpm build
        env:
          CI: true
