[package]
name = "pitch_lake"
description = "Oiler PitchLake"
version = "0.1.0"
edition = "2023_11"

[[target.starknet-contract]]
sierra = true
casm = true

[dependencies]
starknet = "2.12.1"
openzeppelin_token = "2.0.0"
openzeppelin_utils = "2.0.0"
openzeppelin_access = "2.0.0"
fp = "0.1.4"
#snforge_std = "0.31.0"

[dev-dependencies]
cairo_test = "2.12.1"
#snforge_std = "0.32.0"

[tool.fmt]
sort-module-level-items = true

[tool.lint]
# Enable all available lints
enable = true

[tool.lint.cairo]
# Cairo-specific lint rules
unused_imports = true
unused_variables = true
unused_functions = true
unused_parameters = true
unused_returns = true
unreachable_code = true
unused_attributes = true
unused_macros = true
unused_traits = true
unused_impls = true
unused_structs = true
unused_enums = true
unused_constants = true
unused_types = true
unused_modules = true

[lib]
